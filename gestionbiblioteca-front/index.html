<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Inventario | Biblioteca</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="/styles.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-dark mb-4">
  <div class="container">
    <span class="navbar-brand fw-semibold"><i class="bi bi-book-half me-2"></i>Inventario de Biblioteca</span>
  </div>
</nav>

<main class="container pb-5">
  <div class="row g-3 mb-4" id="stats"></div>

  <div class="card">
    <div class="card-body">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <h5 class="mb-0 fw-semibold">Libros registrados</h5>
        <button class="btn btn-primary" id="btn-nuevo"><i class="bi bi-plus-lg me-1"></i>Nuevo libro</button>
      </div>

      <div id="alerta"></div>

      <div class="table-responsive">
        <table class="table table-hover align-middle mb-0">
          <thead>
            <tr>
              <th>#</th><th>Título</th><th>Autor</th><th>Categoría</th><th>Año</th>
              <th class="text-center">Cantidad</th><th class="text-center">Estado</th>
              <th class="text-end">Acciones</th>
            </tr>
          </thead>
          <tbody id="tabla"></tbody>
        </table>
      </div>

      <div id="vacio" class="text-center text-muted py-5 d-none">
        <i class="bi bi-inbox fs-1 d-block mb-2"></i>Aún no hay libros. ¡Agrega el primero!
      </div>
    </div>
  </div>
</main>

<!-- Modal crear / editar -->
<div class="modal fade" id="modal" tabindex="-1">
  <div class="modal-dialog modal-lg">
    <form class="modal-content" id="form">
      <div class="modal-header">
        <h5 class="modal-title" id="modal-titulo">Nuevo libro</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
        <div class="modal-body row g-3">
            <input type="hidden" name="libroId">
            <div class="col-md-8">
                <label class="form-label">Título</label>
                <input name="titulo" class="form-control" required maxlength="200">
            </div>
            <div class="col-md-4">
                <label class="form-label">Autor</label>
                <input name="autor" class="form-control" required maxlength="150">
            </div>
            <div class="col-md-5">
                <label class="form-label">Categoría</label>
                <input name="categoria" class="form-control" required maxlength="100">
            </div>
            <div class="col-md-4">
                <label class="form-label">Fecha de publicación</label>
                <input name="fecha" type="date" class="form-control" required>
            </div>
            <div class="col-md-3">
                <label class="form-label">Cantidad</label>
                <input name="cantidad" type="number" min="0" class="form-control" required>
            </div>
            <div class="col-12"><div id="error-form" class="alert alert-danger d-none mb-0"></div></div>
        </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-light border" data-bs-dismiss="modal">Cancelar</button>
        <button type="submit" class="btn btn-primary"><i class="bi bi-check-lg me-1"></i>Guardar</button>
      </div>
    </form>
  </div>
</div>

<footer class="text-center text-muted small pb-4">Inventario de Biblioteca &middot; Spring Boot + JS nativo</footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/app.js" type="module"></script>
</body>
</html>
